<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" width="64" height="64">
  <defs>
    <style>
      .gold { fill: #C9A84C; stroke: #C9A84C; }
      .gold-stroke { stroke: #C9A84C; fill: none; }
    </style>
  </defs>
  <!-- Outer ring -->
  <circle cx="32" cy="32" r="26" class="gold-stroke" stroke-width="3"/>
  <!-- Inner ring -->
  <circle cx="32" cy="32" r="14" class="gold-stroke" stroke-width="2"/>
  <!-- Gates -->
  <rect x="28" y="2" width="8" height="10" class="gold" rx="1"/>
  <rect x="52" y="28" width="10" height="8" class="gold" rx="1"/>
  <rect x="28" y="52" width="8" height="10" class="gold" rx="1"/>
  <rect x="2" y="28" width="10" height="8" class="gold" rx="1"/>
  <!-- Pathways -->
  <line x1="32" y1="32" x2="32" y2="12" class="gold-stroke" stroke-width="2"/>
  <line x1="32" y1="32" x2="52" y2="32" class="gold-stroke" stroke-width="2"/>
  <line x1="32" y1="32" x2="32" y2="52" class="gold-stroke" stroke-width="2"/>
  <line x1="32" y1="32" x2="12" y2="32" class="gold-stroke" stroke-width="2"/>
  <!-- Central Node -->
  <circle cx="32" cy="32" r="5" class="gold"/>
</svg>