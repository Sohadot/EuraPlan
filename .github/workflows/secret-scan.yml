name: secret-scan

# Machine Secret Gate — see SECURITY_POLICY.md §11 and DISCLOSURE_BOUNDARY.md.
# Blocks credentials, keys, and tokens from reaching the public repository.
# Third-party actions are pinned to immutable commit SHAs (supply-chain governance);
# the trailing comment records the human-readable version.

on:
  pull_request:
  push:
  workflow_dispatch:

permissions:
  contents: read
  pull-requests: write

jobs:
  secret-scan:
    name: secret-scan
    runs-on: ubuntu-latest
    steps:
      - name: Checkout (full history)
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0

      - name: Gitleaks
        uses: gitleaks/gitleaks-action@e0c47f4f8be36e29cdc102c57e68cb5cbf0e8d1e # v3.0.0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          # Never persist scan output that could contain secret values:
          GITLEAKS_ENABLE_UPLOAD_ARTIFACT: false
          GITLEAKS_ENABLE_SUMMARY: true
          # GITLEAKS_LICENSE is required only for GitHub Organization accounts;
          # it is free for user-owned and public repositories. Unset is fine.
          GITLEAKS_LICENSE: ${{ secrets.GITLEAKS_LICENSE }}
