name: Render EuraPlan social preview (temporary)
on:
  push:
    branches:
      - feature/social-share-preview-2026
    paths:
      - assets/brand/og-euraplan-2026.svg
      - .github/workflows/render-social-preview.yml

permissions:
  contents: write

jobs:
  render:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Render static 1200x630 JPEG
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq librsvg2-bin imagemagick
          rsvg-convert -w 1200 -h 630 assets/brand/og-euraplan-2026.svg -o /tmp/euraplan-preview.png
          convert /tmp/euraplan-preview.png -background '#03111d' -alpha remove -alpha off -sampling-factor 4:2:0 -quality 90 assets/brand/og-euraplan-2026.jpg
          file assets/brand/og-euraplan-2026.jpg
      - name: Commit generated JPEG to feature branch
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add assets/brand/og-euraplan-2026.jpg
          git diff --cached --quiet || git commit -m "Render 1200x630 EuraPlan social preview JPEG"
          git push origin HEAD:feature/social-share-preview-2026
