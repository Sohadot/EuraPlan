name: Render preferred social preview (temporary)
on:
  push:
    branches:
      - feature/social-share-preview-2026
    paths:
      - assets/brand/og-euraplan-replacement.avif
      - .github/workflows/render-preferred-social-preview.yml

permissions:
  contents: write

jobs:
  convert:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install image support
        run: python -m pip install 'Pillow>=10.4,<12' pillow-avif-plugin
      - name: Convert approved EuraPlan artwork to JPEG
        run: |
          python - <<'PY'
          import pillow_avif
          from PIL import Image
          image=Image.open('assets/brand/og-euraplan-replacement.avif').convert('RGB')
          assert image.size == (1200,630), f'Unexpected image dimensions: {image.size}'
          image.save('assets/brand/og-euraplan-2026.jpg','JPEG',quality=89,optimize=True,progressive=True,subsampling=0)
          with Image.open('assets/brand/og-euraplan-2026.jpg') as check:
              assert check.size == (1200,630) and check.format=='JPEG'
          PY
      - name: Commit JPEG to feature branch
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add assets/brand/og-euraplan-2026.jpg
          git diff --cached --quiet || git commit -m "Use preferred photorealistic social preview image"
          git push origin HEAD:feature/social-share-preview-2026
